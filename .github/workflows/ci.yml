name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite is hermetic: tests/conftest.py pins these before any app import, so
    # no real service is contacted. They are set here only to make the intent explicit.
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_askai.db
      VECTOR_DB_URL: sqlite:///./test_askai.db
      PINECONE_API_KEY: fake-key-for-ci
      PINECONE_EMBEDDING_API_KEY: fake-key-for-ci
      GROQ_API_KEY: gsk-fake-key-for-ci
      OPENAI_API_KEY: sk-fake-key-for-ci
      JWT_SECRET_KEY: test-secret-key
      LOG_FORMAT: text
      GRIEVANCE_DATABASE_URL: sqlite://
      GRIEVANCE_AUTO_CREATE_TABLES: 'false'
      GRIEVANCE_DEV_LOGIN_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner fast; the project does not need CUDA.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Check every module imports
        run: python -m compileall -q services routers models schemas jobs grievance_app main.py

      - name: Run tests
        run: python -m pytest tests/ -q
